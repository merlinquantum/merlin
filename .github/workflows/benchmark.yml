name: Continuous Benchmarking

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Build benchmark container
      run: |
        docker build -f Dockerfile.benchmark -t merlin-benchmark:latest .

    - name: Run SLOS core benchmarks in container
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/app/host \
          -w /app \
          merlin-benchmark:latest \
          bash -c "pytest tests/benchmark_slos_core.py --benchmark-json=/app/host/benchmark-results.json -v --benchmark-only"

    - name: Setup gh-pages branch
      run: |
        git config --global user.name 'github-action-benchmark'
        git config --global user.email 'github@users.noreply.github.com'
        
        # Check if gh-pages branch exists remotely
        if git ls-remote --exit-code --heads origin gh-pages; then
          echo "gh-pages branch exists remotely, fetching it"
          git fetch origin gh-pages:gh-pages
        else
          echo "gh-pages branch doesn't exist, creating orphan branch"
          git checkout --orphan gh-pages
          git rm -rf .
          echo "# Benchmark Results" > README.md
          git add README.md
          git commit -m "Initial gh-pages commit"
          git push origin gh-pages
          git checkout main
          git fetch origin gh-pages:gh-pages
        fi

    - name: Store benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'pytest'
        output-file-path: benchmark-results.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        # Fail the workflow if performance regression is detected
        fail-on-alert: true
        # Alert if performance is 20% worse than previous
        alert-threshold: '120%'
        # Comment on PR with benchmark results
        comment-on-alert: true
        summary-always: true

  # Fallback benchmark job without container (for comparison/debugging)
  benchmark-native:
    runs-on: ubuntu-latest
    if: failure() # Only run if containerized benchmark fails
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Run SLOS core benchmarks (native)
      run: |
        pytest tests/benchmark_slos_core.py --benchmark-json=benchmark-results-native.json -v --benchmark-only

    - name: Store native benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'pytest'
        output-file-path: benchmark-results-native.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        benchmark-data-dir-path: 'dev/bench/native'
        fail-on-alert: false # Don't fail on native benchmarks
        alert-threshold: '120%'
        comment-on-alert: false

  memory-benchmark:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4

    - name: Build benchmark container
      run: |
        docker build -f Dockerfile.benchmark -t merlin-benchmark:latest .

    - name: Create memory benchmark script
      run: |
        cat > memory_benchmark_simple.py << 'EOF'
        import torch
        import psutil
        import os
        import time
        from merlin import OutputMappingStrategy, QuantumLayer
        import perceval as pcvl
        
        def cpu_memory_benchmark():
            print("Starting CPU memory benchmark...")
            
            # Simple configuration for CI
            modes = 4
            photons = 2 
            
            # Create a simple circuit
            circuit = pcvl.components.GenericInterferometer(
                modes,
                pcvl.components.catalog["mzi phase last"].generate,
                shape=pcvl.InterferometerShape.RECTANGLE,
            )
            
            # Build input state
            input_state = [1, 1, 0, 0]  # 2 photons in first 2 modes
            
            # Create quantum layer
            layer = QuantumLayer(
                input_size=0,
                circuit=circuit,
                n_photons=photons,
                output_mapping_strategy=OutputMappingStrategy.NONE,
                input_state=input_state,
                trainable_parameters=["phi"],
                input_parameters=[],
            )
            
            # Measure memory before
            process = psutil.Process(os.getpid())
            memory_before = process.memory_info().rss / 1024 / 1024  # MB
            
            # Run computation
            start_time = time.time()
            output = layer()
            end_time = time.time()
            
            # Measure memory after
            memory_after = process.memory_info().rss / 1024 / 1024  # MB
            memory_used = memory_after - memory_before
            
            print(f"Memory before computation: {memory_before:.2f} MB")
            print(f"Memory after computation: {memory_after:.2f} MB") 
            print(f"Memory used for computation: {memory_used:.2f} MB")
            print(f"Computation time: {(end_time - start_time)*1000:.2f} ms")
            print(f"Output shape: {output.shape}")
            print(f"Output sum: {output.sum():.4f}")
            
            return {
                "memory_before_mb": memory_before,
                "memory_after_mb": memory_after,
                "memory_used_mb": memory_used,
                "computation_time_ms": (end_time - start_time) * 1000
            }
        
        if __name__ == "__main__": 
            results = cpu_memory_benchmark()
            print("CPU memory benchmark completed successfully")
        EOF

    - name: Run memory benchmarks in container
      run: |
        docker run --rm \
          --user $(id -u):$(id -g) \
          -v ${{ github.workspace }}:/app/host \
          -w /app \
          -e MPLCONFIGDIR=/tmp \
          -e HOME=/tmp \
          merlin-benchmark:latest \
          bash -c "python /app/host/memory_benchmark_simple.py > /app/host/memory-benchmark-output.txt 2>&1 || echo 'Memory benchmark failed, but continuing...' > /app/host/memory-benchmark-output.txt"

    - name: Parse memory benchmark results
      run: |
        cat > parse_memory.py << 'EOF'
        import json
        import re
        
        # Read memory benchmark output
        with open('memory-benchmark-output.txt', 'r') as f:
            content = f.read()
        
        # Extract memory usage values from CPU benchmark output
        results = []
        lines = content.split('\n')
        
        for line in lines:
            # Look for memory measurements
            if 'Memory before computation:' in line:
                numbers = re.findall(r'(\d+\.?\d*)\s*MB', line)
                if numbers:
                    results.append({
                        'name': 'memory_before_computation_mb',
                        'unit': 'MB', 
                        'value': float(numbers[0])
                    })
            elif 'Memory after computation:' in line:
                numbers = re.findall(r'(\d+\.?\d*)\s*MB', line)
                if numbers:
                    results.append({
                        'name': 'memory_after_computation_mb',
                        'unit': 'MB',
                        'value': float(numbers[0])
                    })
            elif 'Memory used for computation:' in line:
                numbers = re.findall(r'(\d+\.?\d*)\s*MB', line)
                if numbers:
                    results.append({
                        'name': 'memory_used_for_computation_mb',
                        'unit': 'MB',
                        'value': float(numbers[0])
                    })
            elif 'Computation time:' in line:
                numbers = re.findall(r'(\d+\.?\d*)\s*ms', line)
                if numbers:
                    results.append({
                        'name': 'computation_time_ms',
                        'unit': 'ms',
                        'value': float(numbers[0])
                    })
        
        # If no results found, create a minimal result to avoid empty file
        if not results:
            results = [{
                'name': 'memory_benchmark_status',
                'unit': 'status',
                'value': 0  # 0 indicates failure/no data
            }]
        
        # Save in github-action-benchmark format
        with open('memory-benchmark-results.json', 'w') as f:
            json.dump(results, f, indent=2)
        EOF
        python parse_memory.py

    - name: Store memory benchmark result
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'customSmallerIsBetter'
        output-file-path: memory-benchmark-results.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        auto-push: true
        benchmark-data-dir-path: 'dev/bench/memory'
        fail-on-alert: true
        alert-threshold: '115%'  # More strict for memory usage
        comment-on-alert: true

    - name: Trigger Pages deployment
      run: |
        curl -X POST \
          -H "Accept: application/vnd.github.v3+json" \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          https://api.github.com/repos/${{ github.repository }}/pages/builds